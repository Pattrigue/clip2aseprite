<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIP to Aseprite</title>
<style>
  :root {
    --bg: #f6f5f8; --surface: #ffffff; --text: #1d1b22; --muted: #6a6575;
    --border: #e2dfe8; --accent: #6b3fd4; --accent-text: #ffffff; --accent-soft: #efe9fc;
    --warn: #8a5a00; --warn-bg: #fff4dc; --error: #b3261e; --error-bg: #fdeceb;
    --check-a: #ffffff; --check-b: #ebe8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141218; --surface: #1d1b22; --text: #ece9f2; --muted: #a29cae;
      --border: #332f3b; --accent: #a585ff; --accent-text: #160f2a; --accent-soft: #2a2240;
      --warn: #f2c46b; --warn-bg: #352a12; --error: #ff9a92; --error-bg: #3a1a18;
      --check-a: #2a2731; --check-b: #232029;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  #drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 200px; padding: 24px; text-align: center; cursor: pointer;
    background: var(--surface); border: 2px dashed var(--border); border-radius: 16px;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-visible { border-color: var(--accent); outline: none; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { font-size: 19px; }
  #drop span { color: var(--muted); }
  #drop svg { color: var(--accent); margin-bottom: 6px; }
  details { margin: 14px 2px 0; color: var(--muted); font-size: 14px; }
  details summary { cursor: pointer; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
  .opts label { display: flex; flex-direction: column; gap: 4px; }
  .opts input {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 180px;
  }
  #bar { display: none; justify-content: space-between; align-items: center; margin: 32px 0 12px; }
  #bar h2 { font-size: 18px; margin: 0; }
  #results { display: grid; gap: 12px; }
  .card {
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  }
  .preview {
    width: 128px; height: 128px; border-radius: 8px; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px;
  }
  .info { min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  .msg { font-size: 14px; border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
  .msg ul { margin: 0; padding-left: 18px; }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .error { background: var(--error-bg); color: var(--error); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button.secondary { background: var(--accent-soft); color: var(--text); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .privacy { color: var(--muted); font-size: 13px; margin-top: 40px; text-align: center; }
  @media (max-width: 480px) {
    .card { grid-template-columns: 1fr; }
    .preview { width: 100%; height: auto; aspect-ratio: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>CLIP → Aseprite</h1>
  <p class="lede">Turns a Clip Studio Paint animation into an Aseprite file — one frame per cel, layers flattened.</p>

  <div id="drop" role="button" tabindex="0" aria-label="Choose .clip files">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0 4.5 4.5M12 3 7.5 7.5"/><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/></svg>
    <strong>Drop .clip files here</strong>
    <span>or click to choose them</span>
  </div>
  <input id="file" type="file" accept=".clip" multiple hidden>

  <details>
    <summary>Options</summary>
    <div class="opts">
      <label>Frame rate (fps)
        <input id="fps" type="number" min="1" max="120" step="1" placeholder="from the .clip file">
      </label>
      <label>Layer name
        <input id="layerName" type="text" value="Sprite Sheet">
      </label>
    </div>
  </details>

  <div id="bar"><h2>Converted files</h2><button id="all" class="secondary" hidden>Download all</button></div>
  <div id="results"></div>

  <p class="privacy">Everything happens on this computer. Your files are never uploaded anywhere.</p>
</main>

<script>
<!--SQLJS-->
</script>
<script>
<!--CORE-->
</script>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Setup
// ---------------------------------------------------------------------------

// sql.js WebAssembly binary, inlined by build.py so the page works offline
const WASM_B64 = "__WASM_BASE64__";

const isBrowserSupported =
  typeof DecompressionStream !== "undefined" && typeof CompressionStream !== "undefined";

const dropZone = document.getElementById("drop");
const fileInput = document.getElementById("file");
const fpsInput = document.getElementById("fps");
const layerNameInput = document.getElementById("layerName");
const resultsBar = document.getElementById("bar");
const results = document.getElementById("results");
const downloadAllButton = document.getElementById("all");

// Download actions for every converted file, used by "Download all"
const downloads = [];

// sql.js is loaded once, the first time a file is converted
let sqlPromise = null;

function loadSql() {
  if (!sqlPromise) {
    const wasm = Uint8Array.from(atob(WASM_B64), (ch) => ch.charCodeAt(0));
    sqlPromise = initSqlJs({ wasmBinary: wasm });
  }
  return sqlPromise;
}


// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function element(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text != null) el.textContent = text;
  return el;
}

function saveFile(name, bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));

  const link = element("a");
  link.href = url;
  link.download = name;
  document.body.append(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// Loop the converted frames on a canvas.
function playPreview(canvas, result) {
  canvas.width = result.width;
  canvas.height = result.height;

  const ctx = canvas.getContext("2d");
  const images = result.frames.map((frame) => new ImageData(
    new Uint8ClampedArray(frame.buffer, frame.byteOffset, frame.length),
    result.width, result.height));

  let index = 0;
  function drawNextFrame() {
    ctx.clearRect(0, 0, result.width, result.height);
    ctx.putImageData(images[index], 0, 0);
    index = (index + 1) % images.length;
  }

  drawNextFrame();
  if (images.length > 1) setInterval(drawNextFrame, result.durationMs);
}


// ---------------------------------------------------------------------------
// Converting a file
// ---------------------------------------------------------------------------

async function convertFile(file) {
  const outputName = file.name.replace(/\.clip$/i, "") + ".aseprite";

  // Result card: preview on the left, details on the right
  const card = element("div", "card");
  const preview = element("canvas", "preview");
  preview.width = preview.height = 1;

  const info = element("div", "info");
  const meta = element("div", "meta", "Converting…");
  info.append(element("div", "name", outputName), meta);

  card.append(preview, info);
  results.prepend(card);
  resultsBar.style.display = "flex";

  try {
    if (!isBrowserSupported) {
      throw new Error("This browser is too old. Please open this page in an up-to-date Chrome, Edge or Firefox.");
    }
    if (!/\.clip$/i.test(file.name)) {
      throw new Error("This isn't a .clip file.");
    }

    const SQL = await loadSql();
    const fps = parseFloat(fpsInput.value);
    const result = await Clip2Ase.convert(SQL, new Uint8Array(await file.arrayBuffer()), {
      fps: fps > 0 ? fps : undefined,
      layerName: layerNameInput.value.trim() || "Sprite Sheet",
    });

    playPreview(preview, result);

    const frameCount = result.frames.length;
    meta.textContent =
      `${frameCount} frame${frameCount === 1 ? "" : "s"} · ` +
      `${result.width}×${result.height} px · ${+result.fps.toFixed(2)} fps`;

    if (result.warnings.length) {
      const box = element("div", "msg warn");
      const list = element("ul");
      result.warnings.forEach((warning) => list.append(element("li", null, warning)));
      box.append(element("div", null, "Converted, but check these:"), list);
      info.append(box);
    }

    const download = () => saveFile(outputName, result.aseprite);
    const button = element("button", null, "Download");
    button.onclick = download;
    info.append(button);

    downloads.push(download);
    downloadAllButton.hidden = downloads.length < 2;
  } catch (error) {
    console.error(error);
    meta.textContent = file.name;
    const message = error && error.message ? error.message : String(error);
    info.append(element("div", "msg error", "Couldn't convert this file. " + message));
  }
}

async function convertFiles(files) {
  for (const file of files) await convertFile(file);
}


// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// Click or keyboard: open the file picker
dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    fileInput.click();
  }
});

fileInput.addEventListener("change", () => {
  convertFiles([...fileInput.files]);
  fileInput.value = ""; // allow picking the same file again
});

// Drag and drop: highlight the drop zone while dragging over it
for (const type of ["dragenter", "dragover"]) {
  dropZone.addEventListener(type, (event) => {
    event.preventDefault();
    dropZone.classList.add("over");
  });
}
for (const type of ["dragleave", "drop"]) {
  dropZone.addEventListener(type, () => dropZone.classList.remove("over"));
}

// Accept drops anywhere on the page, so a near miss doesn't make the browser open the file
window.addEventListener("dragover", (event) => event.preventDefault());
window.addEventListener("drop", (event) => {
  event.preventDefault();
  convertFiles([...event.dataTransfer.files]);
});

// Stagger the downloads slightly so the browser doesn't drop any
downloadAllButton.addEventListener("click", () => {
  downloads.forEach((download, i) => setTimeout(download, i * 300));
});
</script>
</body>
</html>
