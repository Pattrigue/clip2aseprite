<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLIP to Aseprite</title>
<style>
  :root {
    --bg: #f6f5f8; --surface: #ffffff; --text: #1d1b22; --muted: #6a6575;
    --border: #e2dfe8; --accent: #6b3fd4; --accent-text: #ffffff; --accent-soft: #efe9fc;
    --warn: #8a5a00; --warn-bg: #fff4dc; --error: #b3261e; --error-bg: #fdeceb;
    --check-a: #ffffff; --check-b: #ebe8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141218; --surface: #1d1b22; --text: #ece9f2; --muted: #a29cae;
      --border: #332f3b; --accent: #a585ff; --accent-text: #160f2a; --accent-soft: #2a2240;
      --warn: #f2c46b; --warn-bg: #352a12; --error: #ff9a92; --error-bg: #3a1a18;
      --check-a: #2a2731; --check-b: #232029;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  #drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    min-height: 200px; padding: 24px; text-align: center; cursor: pointer;
    background: var(--surface); border: 2px dashed var(--border); border-radius: 16px;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop:focus-visible { border-color: var(--accent); outline: none; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { font-size: 19px; }
  #drop span { color: var(--muted); }
  #drop svg { color: var(--accent); margin-bottom: 6px; }
  details { margin: 14px 2px 0; color: var(--muted); font-size: 14px; }
  details summary { cursor: pointer; }
  .opts { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; }
  .opts label { display: flex; flex-direction: column; gap: 4px; }
  .opts input {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; width: 180px;
  }
  #bar { display: none; justify-content: space-between; align-items: center; margin: 32px 0 12px; }
  #bar h2 { font-size: 18px; margin: 0; }
  #results { display: grid; gap: 12px; }
  .card {
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
  }
  .preview {
    width: 128px; height: 128px; border-radius: 8px; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px;
  }
  .info { min-width: 0; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  .msg { font-size: 14px; border-radius: 8px; padding: 8px 10px; margin: 0 0 10px; }
  .msg ul { margin: 0; padding-left: 18px; }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .error { background: var(--error-bg); color: var(--error); }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  button.secondary { background: var(--accent-soft); color: var(--text); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .privacy { color: var(--muted); font-size: 13px; margin-top: 40px; text-align: center; }
  @media (max-width: 480px) {
    .card { grid-template-columns: 1fr; }
    .preview { width: 100%; height: auto; aspect-ratio: 1; }
  }
</style>
</head>
<body>
<main>
  <h1>CLIP → Aseprite</h1>
  <p class="lede">Turns a Clip Studio Paint animation into an Aseprite file — one frame per cel, layers flattened.</p>

  <div id="drop" role="button" tabindex="0" aria-label="Choose .clip files">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0 4.5 4.5M12 3 7.5 7.5"/><path d="M3 15v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/></svg>
    <strong>Drop .clip files here</strong>
    <span>or click to choose them</span>
  </div>
  <input id="file" type="file" accept=".clip" multiple hidden>

  <details>
    <summary>Options</summary>
    <div class="opts">
      <label>Frame rate (fps)
        <input id="fps" type="number" min="1" max="120" step="1" placeholder="from the .clip file">
      </label>
      <label>Layer name
        <input id="layerName" type="text" value="Sprite Sheet">
      </label>
    </div>
  </details>

  <div id="bar"><h2>Converted files</h2><button id="all" class="secondary" hidden>Download all</button></div>
  <div id="results"></div>

  <p class="privacy">Everything happens on this computer. Your files are never uploaded anywhere.</p>
</main>

<script>

<script>
<!--CORE-->

<script>
"use strict";
const WASM_B64 = "__WASM_BASE64__";
const $ = (id) => document.getElementById(id);
let sqlPromise = null;
function getSQL() {
  if (!sqlPromise) {
    const bin = Uint8Array.from(atob(WASM_B64), (c) => c.charCodeAt(0));
    sqlPromise = initSqlJs({ wasmBinary: bin });
  }
  return sqlPromise;
}
const supported = typeof DecompressionStream !== "undefined" && typeof CompressionStream !== "undefined";
const downloads = [];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function save(name, bytes) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  const a = el("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function animate(canvas, r) {
  canvas.width = r.width; canvas.height = r.height;
  const ctx = canvas.getContext("2d");
  const imgs = r.frames.map((f) => new ImageData(new Uint8ClampedArray(f.buffer, f.byteOffset, f.length), r.width, r.height));
  let i = 0;
  const draw = () => { ctx.clearRect(0, 0, r.width, r.height); ctx.putImageData(imgs[i], 0, 0); i = (i + 1) % imgs.length; };
  draw();
  if (imgs.length > 1) setInterval(draw, r.durationMs);
}

async function handle(file) {
  $("bar").style.display = "flex";
  const card = el("div", "card");
  const canvas = el("canvas", "preview"); canvas.width = canvas.height = 1;
  const info = el("div", "info");
  const outName = file.name.replace(/\.clip$/i, "") + ".aseprite";
  info.append(el("div", "name", outName), el("div", "meta", "Converting…"));
  card.append(canvas, info);
  $("results").prepend(card);
  const meta = info.querySelector(".meta");
  try {
    if (!supported) throw new Error("This browser is too old. Please open this page in an up-to-date Chrome, Edge or Firefox.");
    if (!/\.clip$/i.test(file.name)) throw new Error("This isn't a .clip file.");
    const SQL = await getSQL();
    const fps = parseFloat($("fps").value);
    const r = await Clip2Ase.convert(SQL, new Uint8Array(await file.arrayBuffer()), {
      fps: fps > 0 ? fps : undefined, layerName: $("layerName").value.trim() || "Sprite Sheet",
    });
    animate(canvas, r);
    meta.textContent = `${r.frames.length} frame${r.frames.length === 1 ? "" : "s"} · ${r.width}×${r.height} px · ${+r.fps.toFixed(2)} fps`;
    if (r.warnings.length) {
      const box = el("div", "msg warn"), ul = el("ul");
      box.append(el("div", null, "Converted, but check these:"), ul);
      r.warnings.forEach((w) => ul.append(el("li", null, w)));
      info.append(box);
    }
    const btn = el("button", null, "Download");
    btn.onclick = () => save(outName, r.aseprite);
    info.append(btn);
    downloads.push(() => save(outName, r.aseprite));
    $("all").hidden = downloads.length < 2;
  } catch (e) {
    console.error(e);
    meta.textContent = file.name;
    info.append(el("div", "msg error", "Couldn't convert this file. " + (e && e.message ? e.message : e)));
  }
}

async function handleAll(files) { for (const f of files) await handle(f); }

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } };
$("file").onchange = (e) => { handleAll([...e.target.files]); e.target.value = ""; };
["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));
drop.addEventListener("drop", (e) => { e.preventDefault(); handleAll([...e.dataTransfer.files]); });
// dropping outside the box shouldn't make the browser open the file
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); if (e.target !== drop && !drop.contains(e.target)) handleAll([...e.dataTransfer.files]); });
$("all").onclick = () => downloads.forEach((d, i) => setTimeout(d, i * 300));
</script>
</body>
</html>
